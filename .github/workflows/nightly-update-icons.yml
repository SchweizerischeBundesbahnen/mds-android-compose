# This workflow updates the Compose icons used by this package to the latest vX.Y.Z tag of
# https://github.com/sbb-design-systems/sbb-icons.
# If there is a new version, it opens an issue labeled icon-lib-update and creates / updates a pull request closing it.
# If the update fails, no pull request is created or updated, a comment linking the run is added
# on the issue and the run fails.
# It is run every night.
#
# The icons can be browsed on https://digital.sbb.ch/de/foundation/assets/icons/
# They are guaranteed to be always backward compatible,
# meaning that no icons will disappear or renamed in a minor or patch update.
name: nightly_update_icons

on:
  schedule:
    - cron: "20 3 * * *" # 03:20 am every day
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  update:
    name: Update SBB Icons
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Generate SBB Icons
        id: update
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./gradlew -p tool/sbb-icons run

      - name: Open or update tracking issue
        id: issue
        if: ${{ !cancelled() && steps.update.outputs.new_version != '' }}
        uses: ./.github/actions/icon-lib-tracking-issue
        with:
          version: ${{ steps.update.outputs.new_version }}
          outcome: ${{ steps.update.outcome == 'failure' && 'failure' || 'pending' }}
          token: ${{ github.token }}

      - name: Check for icon changes
        id: icons
        run: |
          if [[ -n "$(git status --porcelain -- compose-mds/src/main/java/ch/sbb/compose_mds/icons/ compose-mds/src/main/java/ch/sbb/compose_mds/sbbicons/)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Android SDK
        if: steps.icons.outputs.changed == 'true'
        uses: android-actions/setup-android@v4

      - name: Record golden files
        if: steps.icons.outputs.changed == 'true'
        run: ./gradlew :example:recordRoborazziDebug

      - name: Read icon version
        id: version
        run: echo "version=$(cat tool/sbb-icons/icons.version)" >> "$GITHUB_OUTPUT"

      - name: Update changelog
        if: steps.icons.outputs.changed == 'true'
        uses: ./.github/actions/icon-lib-changelog-generator
        with:
          version: ${{ steps.version.outputs.version }}
          changelog-path: CHANGELOG.md

      - name: Create Pull Request
        if: steps.icons.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/update-sbb-icons
          commit-message: 'chore: update SBB icons to ${{ steps.version.outputs.version }}'
          title: 'chore: update SBB icons to ${{ steps.version.outputs.version }}'
          body: |
            Automated update of the Compose `SBBIcons` to the [sbb-icons](https://github.com/sbb-design-systems/sbb-icons) tag v${{ steps.version.outputs.version }}.

            Generated with `./gradlew -p tool/sbb-icons run`. Golden files are automatically recorded with `./gradlew :example:recordRoborazziDebug` when icons change. Please review the visual changes.

            Closes #${{ steps.issue.outputs.issue-number }}
          add-paths: |
            CHANGELOG.md
            tool/sbb-icons/icons.version
            compose-mds/src/main/java/ch/sbb/compose_mds/icons/**
            goldenfiles/**

      - name: Mark reported failure as resolved
        if: steps.icons.outputs.changed == 'true'
        uses: ./.github/actions/icon-lib-tracking-issue
        with:
          version: ${{ steps.version.outputs.version }}
          outcome: success
          token: ${{ github.token }}
