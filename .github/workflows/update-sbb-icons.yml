name: Update SBB Icons

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    name: Update SBB Icons
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Generate SBB Icons
        run: ./gradlew -p tool/sbb-icons run

      - name: Check for icon changes
        id: icons
        run: |
          if [[ -n "$(git status --porcelain -- compose-mds/src/main/java/ch/sbb/compose_mds/icons/ compose-mds/src/main/java/ch/sbb/compose_mds/sbbicons/)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Android SDK
        if: steps.icons.outputs.changed == 'true'
        uses: android-actions/setup-android@v4

      - name: Record golden files
        if: steps.icons.outputs.changed == 'true'
        run: ./gradlew :example:recordRoborazziDebug

      - name: Read icon version
        id: version
        run: echo "version=$(cat tool/sbb-icons/icons.version)" >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/update-sbb-icons
          commit-message: 'chore: update SBB icons to ${{ steps.version.outputs.version }}'
          title: 'chore: update SBB icons to ${{ steps.version.outputs.version }}'
          body: |
            Automated update of the Compose `SBBIcons` from https://icons.app.sbb.ch (version ${{ steps.version.outputs.version }}).

            Generated with `./gradlew -p tool/sbb-icons run`. Golden files are automatically recorded with `./gradlew :example:recordRoborazziDebug` when icons change. Please review the visual changes.
          add-paths: |
            tool/sbb-icons/icons.version
            compose-mds/src/main/java/ch/sbb/compose_mds/icons/**
            goldenfiles/**
